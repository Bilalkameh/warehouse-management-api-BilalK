name: Push Docker images

on:
  push:
    branches:
      - main
      - session-11-devops-dockerization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    uses: ./.github/workflows/docker-build.yml

  push-images:
    needs: build-images
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v8
        with:
          name: warehouse-images
          path: ${{ runner.temp }}/warehouse-images

      - name: Load Docker images
        run: |
          docker load --input "${{ runner.temp }}/warehouse-images/warehouse-api.tar"
          docker load --input "${{ runner.temp }}/warehouse-images/warehouse-notifications.tar"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Warehouse API image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          docker tag "warehouse-api:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/warehouse-api:${GITHUB_SHA}"
          docker tag "warehouse-api:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/warehouse-api:latest"
          docker push "${DOCKERHUB_USERNAME}/warehouse-api:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/warehouse-api:latest"

      - name: Push notifications image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          docker tag "warehouse-notifications:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/warehouse-notifications:${GITHUB_SHA}"
          docker tag "warehouse-notifications:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/warehouse-notifications:latest"
          docker push "${DOCKERHUB_USERNAME}/warehouse-notifications:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/warehouse-notifications:latest"